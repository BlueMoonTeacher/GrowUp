# GitHub push 시 자동으로 실행되는 Cloud Build 파이프라인
# 트리거에서 아래 substitutions 값을 override 할 수 있습니다.
#
# _SERVICE_NAME: Cloud Run 서비스 이름
# _REGION:       Cloud Run 리전
# _REPO:         Artifact Registry 저장소 이름 (선택)
#
# 필수 IAM (Cloud Build 서비스 계정):
#   - roles/run.admin
#   - roles/iam.serviceAccountUser
#   - roles/artifactregistry.writer

substitutions:
  _SERVICE_NAME: v1-01
  _REGION: us-west1
  _REPO: cloud-run-source-deploy

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  # BUILD_ID는 수동 제출과 GitHub 트리거 모두에서 항상 제공된다.
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest'

steps:
  # 1. 이전 이미지를 캐시로 pull (빌드 가속)
  - id: 'pull-cache'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest || exit 0

  # 2. Docker 이미지 빌드 (캐시 활용)
  - id: 'build'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:latest'
      - '.'

  # 3. Artifact Registry 로 push
  - id: 'push'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}'

  # 4. Cloud Run 배포 (요청 기반 과금, min-instances 0)
  - id: 'deploy'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        sed 's|__IMAGE_URI__|${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE_NAME}:$BUILD_ID|g' cloudrun.service.yaml > /tmp/cloudrun.service.yaml
        gcloud run services replace /tmp/cloudrun.service.yaml \
          --region=${_REGION} \
          --platform=managed

timeout: '1200s'
