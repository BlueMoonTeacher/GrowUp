apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: v1-01
  annotations:
    generativelanguage.googleapis.com/applet-id: b162ce2d-c429-4ae9-9e43-06a9b56ec795
    generativelanguage.googleapis.com/type: fullstack-applet
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: 'true'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '3'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      containerConcurrency: 80
      serviceAccountName: growup-runtime@gen-lang-client-0151365128.iam.gserviceaccount.com
      timeoutSeconds: 300
      containers:
        - name: app
          image: __IMAGE_URI__
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: FIREBASE_PROJECT_ID
              value: forstudents-e1117
            - name: GEMINI_KEY_KMS_NAME
              value: projects/forstudents-e1117/locations/asia-northeast3/keyRings/growup-secrets/cryptoKeys/gemini-api-keys
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
  traffic:
    - latestRevision: true
      percent: 100
